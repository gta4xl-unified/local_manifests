name: Daily Repo Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GH_PAT_TOKEN }}" | gh auth login --with-token

      - name: Run Sync Script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          ORG="gta4xl-unified"
          BRANCH="lineage-23.1"  # Set this to the version you want
          
          echo "🚀 Starting Daily Sync for $ORG (Target: $BRANCH)..."

          REPOS=$(gh repo list $ORG --limit 100 --json name -q '.[].name')

          for REPO in $REPOS; do
            if [[ "$REPO" == "local_manifests" ]]; then continue; fi

            echo "------------------------------------------------------"
            echo "📦 Processing: $REPO"

            # 1. Clone bare
            rm -rf "tmp_$REPO"
            gh repo clone "$ORG/$REPO" "tmp_$REPO" -- --bare
            cd "tmp_$REPO" || continue

            # 2. Authenticate Push
            git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$ORG/$REPO.git"

            # 3. Define Upstreams
            UPSTREAM_LOS="https://github.com/LineageOS/$REPO.git"
            UPSTREAM_L4="https://github.com/linux4-bringup-priv/$REPO.git"

            SUCCESS=false

            # --- TRY LINEAGEOS ---
            git remote add upstream_los "$UPSTREAM_LOS"
            # FIX: Fetch ALL heads so we definitely see new branches like 23.1
            if git fetch upstream_los "+refs/heads/*:refs/remotes/upstream_los/*" --depth 1; then
                # Check if our specific branch exists in what we just fetched
                if git show-ref --verify --quiet "refs/remotes/upstream_los/$BRANCH"; then
                    echo "✅ Found $BRANCH in LineageOS"
                    # Create the branch locally pointing to the upstream version
                    git update-ref "refs/heads/$BRANCH" "refs/remotes/upstream_los/$BRANCH"
                    SUCCESS=true
                fi
            fi
            
            # --- TRY LINUX4 (If LOS failed) ---
            if [ "$SUCCESS" = false ]; then
                git remote add upstream_l4 "$UPSTREAM_L4"
                if git fetch upstream_l4 "+refs/heads/*:refs/remotes/upstream_l4/*" --depth 1; then
                    if git show-ref --verify --quiet "refs/remotes/upstream_l4/$BRANCH"; then
                        echo "✅ Found $BRANCH in Linux4"
                        git update-ref "refs/heads/$BRANCH" "refs/remotes/upstream_l4/$BRANCH"
                        SUCCESS=true
                    fi
                fi
            fi

            # 4. Push Update
            if [ "$SUCCESS" = true ]; then
                # Push the specific branch explicitly
                git push origin "$BRANCH"
                echo "🚀 Synced $REPO to $BRANCH"
            else
                echo "⚠️  Branch $BRANCH not found in any upstream."
            fi

            cd ..
            rm -rf "tmp_$REPO"
          done
