name: Daily Repo Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GH_PAT_TOKEN }}" | gh auth login --with-token

      - name: Run Sync Script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          ORG="gta4xl-unified"
          BRANCH="lineage-23.1"
          
          echo "🚀 Starting Daily Sync for $ORG..."

          REPOS=$(gh repo list $ORG --limit 100 --json name -q '.[].name')

          for REPO in $REPOS; do
            if [[ "$REPO" == "local_manifests" ]]; then continue; fi

            echo "------------------------------------------------------"
            echo "📦 Processing: $REPO"

            # 1. Clone bare
            rm -rf "tmp_$REPO"
            gh repo clone "$ORG/$REPO" "tmp_$REPO" -- --bare
            cd "tmp_$REPO" || continue

            # 2. FIX: Set the remote URL to include the token explicitly
            git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$ORG/$REPO.git"

            # 3. Define Upstreams
            UPSTREAM_LOS="https://github.com/LineageOS/$REPO.git"
            UPSTREAM_L4="https://github.com/linux4-bringup-priv/$REPO.git"

            SUCCESS=false

            git remote add upstream_los "$UPSTREAM_LOS"
            if git fetch upstream_los "$BRANCH":"$BRANCH" --depth 1 2>/dev/null; then
                echo "✅ Found update in LineageOS"
                SUCCESS=true
            else
                git remote add upstream_l4 "$UPSTREAM_L4"
                if git fetch upstream_l4 "$BRANCH":"$BRANCH" --depth 1 2>/dev/null; then
                    echo "✅ Found update in Linux4"
                    SUCCESS=true
                fi
            fi

            # 4. Push Update
            if [ "$SUCCESS" = true ]; then
                git push origin "$BRANCH"
                echo "🚀 Synced $REPO"
            else
                echo "⚠️  No upstream updates found."
            fi

            # Cleanup
            cd ..
            rm -rf "tmp_$REPO"
          done
